[theme]
base = "dark"
backgroundColor = "#06070A"
secondaryBackgroundColor = "#10151C"
textColor = "#F5F7FA"
borderColor = "#1A1F27"
font = "Pretendard:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css"
headingFont = "Pretendard:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css"
baseFontWeight = 380
baseRadius = "0.85rem"
buttonRadius = "0.55rem"
showWidgetBorder = false
showSidebarBorder = false
primaryColor = "#AEEBFF"
linkColor = "#AEEBFF"
# eyebrow/headline/description 위계를 명확히 하기 위해 헤딩 자체는 절제된 크기로 유지하고
# 큰 타이틀은 config/theme.py의 커스텀 클래스(.adetect-hero-title 등)가 전담합니다.
headingFontSizes = ["2.1rem", "1.5rem", "1.15rem", "1.0rem", "0.95rem", "0.9rem"]
headingFontWeights = ["600", "560", "520", "500", "500", "500"]

[theme.sidebar]
backgroundColor = "#06070A"
borderColor = "#1A1F27"

[server]
headless = true
enableCORS = false

[browser]
gatherUsageStats = false
